<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09101c">
<title>FIELD SCANNER</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:dark;--bg:#09101c;--panel:#121e30;--line:#26364d;--text:#edf5ff;--muted:#99acc7;--accent:#4ce4c1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}
button,input,select{font:inherit}
button,select,input{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:#17253a;color:var(--text)}
button{cursor:pointer;transition:background .2s,transform .2s}
button:hover{background:#233851;transform:translateY(-2px)}
button:active{transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.primary{background:var(--accent);color:#082b29;border-color:var(--accent);font-weight:750}
.primary:hover{background:#83f1d9}
h1,h2,h3,p{margin-top:0}
h1{font-size:30px;letter-spacing:-1px;margin-bottom:4px}
h2{font-size:19px}
small,.muted{color:var(--muted)}
[hidden]{display:none!important}
.logo{width:48px;height:48px;color:var(--accent);flex:none}
.brand{display:flex;align-items:center;gap:12px}
.brand b{letter-spacing:1.5px;line-height:1.2}
.brand small{display:block;font-size:10px;margin-top:5px}
aside{position:fixed;inset:0 auto 0 0;width:230px;background:#0d1625;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;z-index:500}
nav{display:grid;gap:8px;margin-top:35px}
nav button{text-align:left;border:0;background:transparent;color:var(--muted)}
nav button.active{background:#4ce4c114;color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
.side-footer{margin-top:auto;font-size:12px;color:var(--muted)}
main{margin-left:230px;padding:30px;max-width:1800px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}
header p{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#4ce4c113;color:var(--accent);font-size:12px;border:1px solid #4ce4c133}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}
.card{background:linear-gradient(135deg,#152238,#111b2b);border:1px solid var(--line);border-radius:18px;padding:20px}
.card .number{font-size:30px;letter-spacing:-1px;font-weight:750;margin:9px 0 2px}
.card .label{color:var(--muted);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:20px}
.section{animation:enter .35s both}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.controls label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:110px;padding:0}
input[type=checkbox]{accent-color:var(--accent)}
.map-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
#map{height:560px;background:#102234}
.legend{position:absolute;bottom:24px;left:12px;z-index:450;width:220px;background:#0b1525ed;border:1px solid #38506b;border-radius:12px;padding:12px;pointer-events:none}
.legend-bar{height:9px;border-radius:5px;background:linear-gradient(90deg,#3958d7,#2cc7e8,#59df8a,#f2de45,#ff8640,#ec407b);margin:8px 0}
.legend-values{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin:12px 0 0}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
canvas.chart{width:100%;height:230px;display:block}
.table-wrap{overflow:auto;max-height:550px}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}
th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line)}
th{position:sticky;top:0;background:#17253b;color:var(--muted);z-index:1}
tr:hover td{background:#ffffff04}
.empty{text-align:center;padding:30px;color:var(--muted)}
.drop{border:2px dashed #3a536e;border-radius:16px;padding:35px;text-align:center;background:#0c1625}
.drop.drag{border-color:var(--accent);background:#4ce4c109}
.history-item{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding:16px 0}
.history-item:last-child{border:0}
#intro{position:fixed;inset:0;z-index:2000;background:#09101c;display:grid;place-items:center;transition:opacity .4s}
.intro-content{text-align:center;animation:enter .7s both}
#intro .logo{width:115px;height:115px;filter:drop-shadow(0 0 25px #4ce4c155)}
.intro-title{font-size:28px;letter-spacing:5px;font-weight:800;margin:22px 0 5px}
.track{width:190px;height:3px;background:#203247;margin:25px auto;overflow:hidden;border-radius:4px}
