<style>
:root {
  color-scheme: dark;
  --bg: #080e18;
  --panel: #111c2c;
  --line: #25364e;
  --text: #edf4ff;
  --muted: #9badc5;
  --accent: #43dfc4;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, sans-serif;
}
button, input, select, textarea { font: inherit; }
button {
  cursor: pointer;
  padding: 11px 16px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #17263c;
  color: var(--text);
  transition: transform .2s, background .2s, border-color .2s;
}
button:hover {
  background: #223851;
  border-color: #4c6989;
  transform: translateY(-2px);
}
button:active { transform: scale(.98); }
button:disabled { opacity: .5; cursor: wait; }
.primary {
  background: var(--accent);

  color: #082b2b;
  font-weight: 700;
}
.primary:hover { background: #75ecd7; }
input, select, textarea {
  max-width: 100%;

  border-radius: 9px;
  background: #0b1422;
  color: var(--text);
}
input[type=checkbox], input[type=range] {
  accent-color: var(--accent);
}
input[type=checkbox] { width: 17px; height: 17px; }
input[type=range] { width: 100%; padding: 0; }
button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;

h1 { font-size: 30px; letter-spacing: -1px; margin-bottom: 5px; }

[hidden] { display: none !important; }

  font-weight: 650;
  margin-bottom: 10px;
}
.logo {

}
.brand { display: flex; align-items: center; gap: 12px; }

.brand small { display: block; font-size: 10px; margin-top: 6px; }

}
.login-art .logo { width: 90px; height: 90px; }

}
.login-card input[type=password] {

.check { display: flex; align-items: center; gap: 9px; margin: 15px 0; }

  background: #080e18;
  z-index: 10000;
  display: grid;
  place-items: center;
}
.intro-center { text-align: center; animation: appear 1s both; }
#intro .logo {
  width: 110px;

}
.intro-word {

}
.intro-track {
  width: 180px;

}
.intro-track i {
  display: block;

}
#skip-intro { position: absolute; right: 25px; bottom: 25px; }

.side-foot button { margin-top: 15px; width: 100%; }
main { margin-left: 235px; padding: 30px 35px; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  margin-bottom: 25px;
}
header .muted { margin: 0; font-size: 14px; }
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 23px;
}
